<!DOCTYPE html>
<html lang="rw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Yanjye</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#075E54">
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#ECE5DD}.top{background:#075E54;color:#fff;padding:14px;font-weight:700;font-size:19px;display:flex;justify-content:space-between;align-items:center}.top small{font-weight:400;font-size:12px;opacity:.9}.wrap{max-width:520px;margin:auto;background:#fff;min-height:100vh}.row{display:flex;gap:8px;padding:10px}.row input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px}.btn{background:#25D366;border:0;padding:12px 14px;border-radius:10px;font-weight:700}.card{padding:12px 14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.card b{font-size:16px}.card span{color:#666;font-size:13px}.chathead{background:#075E54;color:#fff;padding:12px;display:flex;gap:10px;align-items:center}.msgs{padding:12px;height:58vh;overflow:auto;background:#ECE5DD}.m{background:#fff;padding:9px 12px;border-radius:12px;margin:6px 0;max-width:80%}.m.me{background:#DCF8C6;margin-left:auto}.m small{display:block;color:#666;font-size:11px}.inputbar{display:flex;gap:8px;padding:10px;background:#fff}.inputbar input{flex:1;padding:12px;border:1px solid #ddd;border-radius:22px}.callbar{display:flex;gap:8px;padding:8px;background:#fff}.callbar button{flex:1;padding:11px;border:0;border-radius:10px;font-weight:700}.vid{width:100%;border-radius:12px;background:#000;max-height:240px}.hidden{display:none}.note{padding:10px;background:#FFF3CD;font-size:13px}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>const firebaseConfig={apiKey:"AIzaSyAxI8oW08aueUc_ee0YrFe_EzG0zMwVzMU",authDomain:"chat-yanjye.firebaseapp.com",projectId:"chat-yanjye",storageBucket:"chat-yanjye.firebasestorage.app",messagingSenderId:"41041252671",appId:"1:41041252671:web:78be8074acc3fffb82838a",measurementId:"G-5SPE8VGD10"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();</script>
</head><body><div class="wrap">
<div class="top"><div>Chat Yanjye <br><small>Message • Call • Video — kuri server</small></div><div id="myName">—</div></div>
<div id="home">
<div class="note">Izina ryawe ribikwa muri iyi telefoni gusa. Abandi bafunguye iyi link babona message zawe ako kanya, kuko zijya kuri Firebase.</div>
<div class="row"><input id="nameInput" placeholder="Andika izina ryawe, urugero: Alphonse"><button class="btn" onclick="saveName()">Bika izina</button></div>
<div class="row"><input id="newContact" placeholder="Andika izina rya contact nshya"><button class="btn" onclick="addContact()">+ Ongeramo</button></div>
<div id="contacts"></div>
</div>
<div id="chatView" class="hidden">
<div class="chathead"><button onclick="goHome()" style="background:#fff;border:0;padding:8px 10px;border-radius:8px">←</button><b id="chatTitle"></b><span id="status" style="font-size:12px"></span></div>
<div class="callbar"><button onclick="startCall(false)" style="background:#25D366">📞 Call</button><button onclick="startCall(true)" style="background:#128C7E;color:#fff">📹 Video</button><button onclick="stopCall()" style="background:#eee">Hagarika</button></div>
<video id="localVideo" class="vid hidden" autoplay muted playsinline></video>
<video id="remoteVideo" class="vid hidden" autoplay playsinline></video>
<div class="msgs" id="msgs"></div>
<div class="inputbar"><input id="msgInput" placeholder="Andika ubutumwa..."><button class="btn" onclick="sendMsg()">Ohereza</button></div>
</div></div>
<script>
let myName=localStorage.getItem('chatyanjye_name')||'';let contacts=JSON.parse(localStorage.getItem('chatyanjye_contacts')||'["Mama","Inshuti"]');let cur='';let unsub=null;let localStream=null;let pc=null;let callDoc=null;
document.getElementById('myName').textContent=myName||'Shyiramo izina';document.getElementById('nameInput').value=myName;
function saveName(){myName=document.getElementById('nameInput').value.trim();if(!myName)return alert('Andika izina');localStorage.setItem('chatyanjye_name',myName);document.getElementById('myName').textContent=myName;alert('Izina ryabitswe: '+myName);}
function renderContacts(){document.getElementById('contacts').innerHTML=contacts.map(c=>'<div class="card" onclick="openChat(\''+c+'\')"><div><b>'+c+'</b><br><span>Kanda ufungure chat</span></div><div>›</div></div>').join('');}
function addContact(){let v=document.getElementById('newContact').value.trim();if(!v)return;if(!contacts.includes(v))contacts.push(v);localStorage.setItem('chatyanjye_contacts',JSON.stringify(contacts));document.getElementById('newContact').value='';renderContacts();}
function chatId(a,b){return [a,b].sort().join('__');}
function openChat(c){if(!myName)return alert('Banza ushyiremo izina ryawe hejuru');cur=c;document.getElementById('home').classList.add('hidden');document.getElementById('chatView').classList.remove('hidden');document.getElementById('chatTitle').textContent=c;document.getElementById('status').textContent=' • kuri server';if(unsub)unsub();unsub=db.collection('messages').where('chatId','==',chatId(myName,cur)).orderBy('time').onSnapshot(s=>{let box=document.getElementById('msgs');box.innerHTML='';s.forEach(d=>{let m=d.data();let div=document.createElement('div');div.className='m'+(m.from===myName?' me':'');div.innerHTML='<b>'+m.from+'</b><br>'+escapeHtml(m.text)+'<small>'+new Date(m.time).toLocaleTimeString()+'</small>';box.appendChild(div);});box.scrollTop=box.scrollHeight;});}
function goHome(){if(unsub)unsub();document.getElementById('chatView').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function sendMsg(){let inp=document.getElementById('msgInput');let text=inp.value.trim();if(!text||!cur)return;inp.value='';await db.collection('messages').add({chatId:chatId(myName,cur),from:myName,to:cur,text:text,time:Date.now()});}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
async function startCall(withVideo){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:withVideo});let lv=document.getElementById('localVideo');lv.srcObject=localStream;lv.classList.remove('hidden');document.getElementById('remoteVideo').classList.remove('hidden');pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];};callDoc=db.collection('calls').doc(chatId(myName,cur));let offer=await pc.createOffer();await pc.setLocalDescription(offer);await callDoc.set({from:myName,to:cur,offer:{type:offer.type,sdp:offer.sdp},time:Date.now()});callDoc.onSnapshot(async s=>{let d=s.data();if(d&&d.answer&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(d.answer));}});pc.onicecandidate=e=>{if(e.candidate)callDoc.collection('candidates').add(e.candidate.toJSON());};alert('Call yoherejwe kuri '+cur+'. Nawe afungure Chat Yanjye, yinjire muri chat yawe, akande Emeza Call.');}catch(err){alert('Ntibikunda: '+err.message+' - Emeza Microphone/Camera muri browser.');}}
async function stopCall(){if(localStream)localStream.getTracks().forEach(t=>t.stop());if(pc)pc.close();document.getElementById('localVideo').classList.add('hidden');document.getElementById('remoteVideo').classList.add('hidden');}
renderContacts();
// Auto-answer: listen for incoming calls for me
db.collection('calls').where('to','==',myName).onSnapshot(s=>{s.forEach(async d=>{let data=d.data();if(data&&data.offer&&confirm('Call / Video ivuye kuri '+data.from+'. Urayemera?')){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});document.getElementById('localVideo').srcObject=localStream;document.getElementById('localVideo').classList.remove('hidden');document.getElementById('remoteVideo').classList.remove('hidden');openChat(data.from);pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];};await pc.setRemoteDescription(new RTCSessionDescription(data.offer));let ans=await pc.createAnswer();await pc.setLocalDescription(ans);await d.ref.update({answer:{type:ans.type,sdp:ans.sdp}});}catch(e){alert(e.message);}}});});
</script></body></html>
