<!DOCTYPE html>
<html lang="rw"><head><link rel="manifest"href="manifest.josn"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Yanjye</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#ece5dd}.top{background:#075e54;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.top button{background:#fff;color:#075e54;border:0;padding:7px 10px;border-radius:20px;font-weight:700}.wrap{max-width:480px;margin:auto;background:#fff;min-height:100vh}.search{padding:10px}.search input{width:100%;padding:10px;border-radius:20px;border:1px solid #ddd}.contact{display:flex;gap:10px;padding:12px;border-bottom:1px solid #eee;cursor:pointer;align-items:center}.ava{width:46px;height:46px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}.contact b{display:block}.contact small{color:#666}.chat{display:none;flex-direction:column;height:100vh}.chatHead{background:#075e54;color:#fff;padding:12px;display:flex;gap:10px;align-items:center}.chatHead button{background:none;border:0;color:#fff;font-size:22px}.msgs{flex:1;padding:12px;background:#ece5dd;display:flex;flex-direction:column;gap:8px;overflow:auto}.msg{max-width:80%;padding:9px 12px;border-radius:10px;background:#fff}.me{align-self:flex-end;background:#dcf8c6}.input{display:flex;padding:8px;gap:6px;background:#fff}.input input{flex:1;padding:11px;border-radius:20px;border:1px solid #ddd}.input button{background:#25d366;border:0;color:#fff;padding:10px 16px;border-radius:50%;font-size:18px}.add{padding:12px;display:flex;gap:6px}.add input{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd}.add button{background:#075e54;color:#fff;border:0;padding:10px;border-radius:8px}</style></head>
<body><div class="wrap" id="home"><div class="top"><h2>Chat Yanjye</h2><button onclick="showAdd()">+ Contact</button></div><div class="search"><input id="q" oninput="render()" placeholder="Shakisha..."></div><div class="add" id="addBox" style="display:none"><input id="newName" placeholder="Izina ry'umuntu"><input id="newNum" placeholder="Numero"><button onclick="addContact()">Ongeraho</button></div><div id="list"></div><p style="text-align:center;color:#888;padding:16px">Ubutumwa bubikwa muri telephone yawe gusa</p></div>
<div class="wrap chat" id="chatView"><div class="chatHead"><button onclick="back()">←</button><div class="ava" id="chatAva">A</div><b id="chatName">Izina</b></div><div class="msgs" id="msgs"></div><div class="input"><input id="txt" placeholder="Andika ubutumwa..."><button onclick="send()">➤</button></div></div>
<script>let contacts=JSON.parse(localStorage.getItem('cy_contacts')||'[{"name":"Maman","num":"0780000000"},{"name":"Inshuti","num":"0781111111"}]');let msgs=JSON.parse(localStorage.getItem('cy_msgs')||'{}');let cur=0;function save(){localStorage.setItem('cy_contacts',JSON.stringify(contacts));localStorage.setItem('cy_msgs',JSON.stringify(msgs))}function render(){let q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('list').innerHTML=contacts.map((c,i)=>{if(!c.name.toLowerCase().includes(q))return '';let last=(msgs[i]||[]).slice(-1)[0];return `<div class="contact" onclick="openChat(${i})"><div class="ava">${c.name[0]}</div><div><b>${c.name}</b><small>${c.num} • ${last?last.text:'Nta butumwa'}</small></div></div>`}).join('')}function showAdd(){let b=document.getElementById('addBox');b.style.display=b.style.display=='none'?'flex':'none'}function addContact(){let n=document.getElementById('newName').value.trim(),p=document.getElementById('newNum').value.trim();if(!n)return alert('Andika izina');contacts.push({name:n,num:p||''});save();render();showAdd();document.getElementById('newName').value='';document.getElementById('newNum').value=''}function openChat(i){cur=i;document.getElementById('home').style.display='none';document.getElementById('chatView').style.display='flex';document.getElementById('chatName').textContent=contacts[i].name;document.getElementById('chatAva').textContent=contacts[i].name[0];renderMsgs()}function renderMsgs(){document.getElementById('msgs').innerHTML=(msgs[cur]||[]).map(m=>`<div class="msg ${m.me?'me':''}">${m.text}<br><small style="font-size:11px;color:#666">${m.time}</small></div>`).join('')}function send(){let t=document.getElementById('txt');if(!t.value.trim())return;if(!msgs[cur])msgs[cur]=[];msgs[cur].push({text:t.value,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),me:true});save();t.value='';renderMsgs();render()}function back(){document.getElementById('home').style.display='block';document.getElementById('chatView').style.display='none';render()}render();document.getElementById('txt').addEventListener('keydown',e=>{if(e.key=='Enter')send()})</script></body></html>
